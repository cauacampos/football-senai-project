services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: futebol
      POSTGRES_PASSWORD: futebol
      POSTGRES_DB: futebol
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futebol"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: